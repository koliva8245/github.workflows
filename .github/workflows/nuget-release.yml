name: Nuget Release

on:
  workflow_call:
    inputs:
      artifacts-workflow:
        required: true
        type: string
    secrets:
      token:
        required: true

env:
  ARTIFACTS: ./artifacts

jobs:
  download-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.token }}
          workflow: ${{ inputs.artifacts-workflow }}
          name: "-Nuget$"
          name_is_regexp: true
          path: ${{ env.ARTIFACTS }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-artifacts
          path: ${{ env.ARTIFACTS }}
